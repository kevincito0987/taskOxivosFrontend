services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: oxivos-store-frontend-dev
    volumes:
      - .:/workspaces/taskOxivosFrontend:cached
      # Evitar montar /var/run/docker.sock salvo que sea estrictamente indispensable
      - vscode-server:/home/node/.vscode-server
    working_dir: /workspaces
    command: sleep infinity
    environment:
      - TZ=UTC
      - PORT=5173
      - NODE_ENV=development
    ports:
      - "5173:5173"
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vscode-server: